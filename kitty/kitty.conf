# Lilt's config

# Font settings
font_family PP Right Serif Mono Regular
bold_font PP Right Serif Mono Dark
italic_font PP Right Serif Mono Regular Italic
bold_italic_font PP Right Serif Mono Dark Italic
font_size 12
text_composition_strategy 1 30

# Window settings
remember_window_size no
initial_window_width  30c
initial_window_height 8c
background_opacity 1
confirm_os_window_close 0
scrollback_lines 10000
window_padding_width 6
shell_integration no-title

# Colours
include themes/mono.conf


