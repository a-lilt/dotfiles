; ~/.config/polybar/config.ini
; Simple white bar: workspaces | network, volume, battery, time

[colors]
bg = #ffffff
fg = #000000
dim = #888888

[bar/main]
dpi = 96
width = 100%
height = 24
background = ${colors.bg}
foreground = ${colors.fg}
font-0 = "PP Right Serif Mono:style=Regular:pixelsize=12;3"
font-1 = "Spleen:pixelsize=16;2"
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.dim}
enable-ipc = true

modules-left = workspaces
modules-right = memory network volume battery time

; makes the window manager leave space for the bar
wm-restack = generic
override-redirect = false

[module/workspaces]
type = internal/xworkspaces
; active workspace shown inverted (black box, white text)
label-active = %name%
label-active-background = ${colors.fg}
label-active-foreground = ${colors.bg}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.dim}
label-empty-padding = 1
label-urgent = %name%
label-urgent-padding = 1

[module/window]
type = internal/xwindow
label = %title:0:60:...%

[module/memory]
label = ram %used%
type = internal/memory

; Seconds to sleep between updates
; Default: 1
interval = 3

; Default: 90
; New in version 3.6.0
warn-percentage = 95

[module/network]
type = internal/network
interface-type = wireless
interval = 5
label-connected = wifi %essid%
label-disconnected = wifi off
label-disconnected-foreground = ${colors.dim}

[module/volume]
type = internal/pulseaudio
label-volume = vol %percentage%%
label-muted = vol muted
label-muted-foreground = ${colors.dim}
; scroll to change volume, click to mute (built in)

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 10
label-charging = bat %percentage%%+
label-discharging = bat %percentage%%
label-full = bat full

[module/time]
type = custom/script
exec = date +"%-I:%M %P"
interval = 5
